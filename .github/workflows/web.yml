# Builds the web (HTML5) version of the game with Ren'Py and publishes it to
# GitHub Pages on every push to main. You can also run it by hand from the
# Actions tab ("Run workflow").
#
# The game ends up at https://<user>.github.io/<repo>/
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".

name: Build web version and deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/workflows/fetch-renpy-sdk.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Ren'Py versions to try, newest first. The first one that downloads is used.
  RENPY_VERSIONS: "8.3.7 8.3.4"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to publish test reports to the ci-reports branch
    steps:
      - name: Check out the game
        uses: actions/checkout@v4

      - name: Pick a Ren'Py version
        id: version
        run: |
          for v in $RENPY_VERSIONS; do
            if curl -sfI "https://www.renpy.org/dl/$v/renpy-$v-web.zip" > /dev/null; then
              echo "Using Ren'Py $v"
              echo "renpy=$v" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "None of these Ren'Py versions could be downloaded: $RENPY_VERSIONS" >&2
          echo "Edit RENPY_VERSIONS in .github/workflows/web.yml (see https://www.renpy.org/release_list.html)." >&2
          exit 1

      - name: Cache the Ren'Py SDK
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/renpy-sdk
          key: renpy-sdk-web-${{ steps.version.outputs.renpy }}

      - name: Download the Ren'Py SDK and web support
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          V: ${{ steps.version.outputs.renpy }}
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl -sfL "https://www.renpy.org/dl/$V/renpy-$V-sdk.tar.bz2" -o sdk.tar.bz2
          tar -xjf sdk.tar.bz2
          mv "renpy-$V-sdk" ~/renpy-sdk

          curl -sfL "https://www.renpy.org/dl/$V/renpy-$V-web.zip" -o web.zip
          mkdir web-unzip
          unzip -q web.zip -d web-unzip
          # The zip may or may not wrap the web/ folder in an SDK-named folder.
          webdir=$(find web-unzip -maxdepth 3 -type d -name web | head -n 1)
          if [ -z "$webdir" ]; then echo "No web/ folder in web.zip" >&2; exit 1; fi
          mv "$webdir" ~/renpy-sdk/web
          ls ~/renpy-sdk/web | head

      - name: Lint the game
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: dummy
        run: |
          ~/renpy-sdk/renpy.sh "$GITHUB_WORKSPACE" lint "$RUNNER_TEMP/lint.txt" || true
          cat "$RUNNER_TEMP/lint.txt"
          { echo '## Ren'"'"'Py lint report'; echo '```'; cat "$RUNNER_TEMP/lint.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Install a virtual display for the tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libegl1 libgl1-mesa-dri > /dev/null

      - name: Play through the game automatically (game/tests.rpy)
        env:
          VN_TEST: "1"
          VN_TEST_REPORT: ${{ runner.temp }}/test-report.txt
          RENPY_PERFORMANCE_TEST: "0"
          SDL_AUDIODRIVER: dummy
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set +e
          timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24" ~/renpy-sdk/renpy.sh "$GITHUB_WORKSPACE"
          code=$?
          set -e
          if [ ! -f "$VN_TEST_REPORT" ]; then
            echo "Do Not Disturb — automated playthrough report: FAIL" > "$VN_TEST_REPORT"
            echo "The game exited (status $code) before writing a report." >> "$VN_TEST_REPORT"
            code=1
          fi
          for f in traceback.txt errors.txt; do
            if [ -f "$GITHUB_WORKSPACE/$f" ]; then
              { echo; echo "===== $f ====="; cat "$GITHUB_WORKSPACE/$f"; } >> "$VN_TEST_REPORT"
              code=1
            fi
          done
          cat "$VN_TEST_REPORT"
          { echo '## Automated playthrough'; echo '```'; cat "$VN_TEST_REPORT"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # Surface each failure as an annotation on the run.
          grep -E '^  \[' "$VN_TEST_REPORT" | head -40 | while IFS= read -r line; do
            echo "::error title=Playthrough failure::${line#  }"
          done || true
          exit $code

      - name: Publish lint and test reports to the ci-reports branch
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          cd "$RUNNER_TEMP/reports"
          for f in "$RUNNER_TEMP/lint.txt" "$RUNNER_TEMP/test-report.txt" "$GITHUB_WORKSPACE/log.txt" "$GITHUB_WORKSPACE/traceback.txt" "$GITHUB_WORKSPACE/errors.txt"; do
            [ -f "$f" ] && cp "$f" .
          done
          echo "Reports for commit $GITHUB_SHA (run $GITHUB_RUN_ID)" > README.md
          git init -q
          git checkout -q -b ci-reports
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Reports for $GITHUB_SHA"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-reports

      - name: Build the web version
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: dummy
        run: |
          ~/renpy-sdk/renpy.sh ~/renpy-sdk/launcher web_build "$GITHUB_WORKSPACE" --destination "$RUNNER_TEMP/site"
          ls -la "$RUNNER_TEMP/site"
          test -f "$RUNNER_TEMP/site/index.html"
          # GitHub Pages: serve files as-is (no Jekyll processing).
          touch "$RUNNER_TEMP/site/.nojekyll"
          # Publish the lint report alongside the game (…/visualnovel/lint.txt).
          cp "$RUNNER_TEMP/lint.txt" "$RUNNER_TEMP/site/lint.txt"

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
